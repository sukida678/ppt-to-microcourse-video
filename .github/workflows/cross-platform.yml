name: cross-platform

# Real Linux + macOS evidence, not inference:
#   compose      → deterministic, no network: ffmpeg/libass, CJK font discovery,
#                  paths that contain a space and CJK characters, global SRT timing
#   full-pipeline → the actual product path: LibreOffice → PNG, edge-tts → mp3 + word
#                  timings, compose → course.mp4
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  compose:
    name: compose · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg (+ a CJK font on Linux)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            # The ubuntu-latest image already ships ffmpeg with libass; only the CJK font
            # is missing. Installing both risks a 30-minute apt stall for nothing.
            sudo apt-get update -qq -o Acquire::Retries=2
            if ! command -v ffmpeg >/dev/null; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
            fi
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          else
            # NOT `brew install ffmpeg`: since 9.0 that formula is the slim build with no
            # libass/fontconfig/freetype, so the `subtitles` filter is absent and burned-in
            # subtitles are impossible. `ffmpeg-full` is the one with libass.
            brew install ffmpeg-full
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi

      - name: ffmpeg can actually do this job
        run: |
          # Every capability the pipeline depends on, checked one by one and reported
          # as a check-run annotation, so a failure is readable without the raw log.
          echo "ffmpeg: $(command -v ffmpeg)"
          command -v -a ffmpeg || true
          ffmpeg -hide_banner -version | head -2 || true
          missing=""
          for cap in filters:subtitles filters:zoompan encoders:libx264 encoders:aac; do
            kind=${cap%%:*}
            name=${cap##*:}
            if ffmpeg -hide_banner -"$kind" 2>/dev/null | grep -qw "$name"; then
              echo "ok    $kind/$name"
            else
              echo "MISS  $kind/$name"
              echo "::error title=ffmpeg capability missing::$kind/$name is not in $(command -v ffmpeg) — $(ffmpeg -hide_banner -version 2>/dev/null | head -1)"
              missing="$missing $kind/$name"
            fi
          done
          ffmpeg -hide_banner -buildconf 2>/dev/null | grep -E 'libass|libx264|freetype' || echo "::warning title=ffmpeg buildconf::no libass/libx264/freetype line in -buildconf"
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            exit 1
          fi

      - name: Build a project whose paths contain a space and CJK
        run: |
          set -e
          proj="ci test/课件"
          mkdir -p "$proj/png" "$proj/sub" "$proj/audio"
          for n in 01 02; do
            ffmpeg -y -hide_banner -loglevel error -f lavfi -i "color=c=white:s=1280x720" -frames:v 1 "$proj/png/slide_$n.png"
            ffmpeg -y -hide_banner -loglevel error -f lavfi -i "anullsrc=r=48000:cl=stereo" -t 3 -c:a aac "$proj/audio/$n.m4a"
          done
          printf '1\n00:00:00,000 --> 00:00:01,400\n第一行中文字幕\n\n2\n00:00:01,500 --> 00:00:02,900\n第二行字幕，带逗号\n\n' > "$proj/sub/01.srt"
          cp "$proj/sub/01.srt" "$proj/sub/02.srt"
          cat > "$proj/manifest.json" <<'JSON'
          {
            "segments": [
              {"id": "01", "image": "png/slide_01.png", "audio": "audio/01.m4a",
               "srt": "sub/01.srt", "duration": 3.0},
              {"id": "02", "image": "png/slide_02.png", "audio": "audio/02.m4a",
               "srt": "sub/02.srt", "duration": 3.0}
            ]
          }
          JSON

      - name: Compose (burned-in subtitles, ken-burns, fade)
        run: |
          set -euo pipefail
          python scripts/compose.py --project "ci test/课件" \
            --resolution 1280x720 --motion kenburns --transition fade | tee compose.log

      - name: Assert the output is what we asked for
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          proj = pathlib.Path("ci test/课件")
          out = proj / "course.mp4"
          assert out.exists(), "compose produced no course.mp4"

          # the compositor prints its summary as the last JSON object on stdout
          text = pathlib.Path("compose.log").read_text(encoding="utf-8-sig")
          lines = text.strip().splitlines()
          summary = None
          for i in range(len(lines) - 1, -1, -1):
              if lines[i].lstrip().startswith("{"):
                  try:
                      summary = json.loads("\n".join(lines[i:]))
                  except json.JSONDecodeError:
                      summary = None
                  if summary:
                      break
          assert summary, "no JSON summary"
          assert summary.get("ok") is True, summary
          assert summary.get("segments") == 2, summary
          assert summary.get("srt_cues", 0) >= 4, summary
          font = summary.get("sub_font", "")
          assert font, "no font was chosen"
          print("chosen subtitle font:", font)

          def probe(entries, f):
              return subprocess.check_output(
                  ["ffprobe", "-v", "error", "-show_entries", entries, "-of", "csv=p=0", str(f)],
                  text=True).strip()

          dur = float(probe("format=duration", out))
          expected = 2 * (3.0 + 0.7)  # hold + tail per segment
          print(f"duration {dur:.3f}s (expected ~{expected:.1f}s)")
          assert abs(dur - expected) < 1.5, dur

          stream = subprocess.check_output(
              ["ffprobe", "-v", "error", "-show_entries",
               "stream=codec_name,width,height", "-of", "csv=p=0", str(out)],
              text=True).strip().splitlines()
          print("streams:", stream)
          assert any("h264" in s for s in stream), stream
          assert any("1280" in s and "720" in s for s in stream), stream
          assert any("aac" in s for s in stream), stream

          # a frame that actually carries the burned-in subtitles
          frame = proj / "check.png"
          subprocess.run(["ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                          "-ss", "1.5", "-i", str(out), "-frames:v", "1", str(frame)],
                         check=True)
          assert frame.stat().st_size > 2000, "the extracted frame looks blank"
          print("frame bytes:", frame.stat().st_size)
          print("COMPOSE OK")
          PY

      - name: A missing font must be substituted, never burned as empty boxes
        run: |
          out=$(python scripts/compose.py --project "ci test/课件" \
                  --resolution 1280x720 --motion none --sub-font "Zz No Such Font" 2>&1)
          echo "$out" | tail -20
          if ! echo "$out" | grep -E "not installed — using|no CJK font installed"; then
            echo "::error title=no font substitution::compose kept 'Zz No Such Font' — a missing family would burn every CJK glyph as an empty box"
            exit 1
          fi

  full-pipeline:
    name: full pipeline · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, LibreOffice, CJK fonts
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq -o Acquire::Retries=2
            # --no-install-recommends keeps this to the part the renderer actually uses
            if ! command -v ffmpeg >/dev/null; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
            fi
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-noto-cjk libreoffice-impress
          else
            brew install ffmpeg-full
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
            brew install --cask libreoffice
            ls -d /Applications/LibreOffice.app/Contents/MacOS/soffice || true
          fi

      - name: Python dependencies
        run: python -m pip install --quiet edge-tts pymupdf python-pptx

      - name: Doctor must say the full pipeline is ready
        run: |
          set -uo pipefail
          python scripts/doctor.py --no-net > doctor.json || true
          python - <<'PY'
          import json, os, pathlib

          report = json.loads(pathlib.Path("doctor.json").read_text(encoding="utf-8-sig"))
          os_name = os.environ.get("RUNNER_OS", "?")
          print(json.dumps(report, ensure_ascii=False, indent=1))
          # Publish the interesting fields as an annotation: the raw job log needs admin
          # rights to download, the annotations endpoint does not.
          slim = {k: report.get(k) for k in
                  ("python", "ffmpeg", "ffprobe", "libreoffice", "network",
                   "ready", "blockers", "warnings")}
          print(f"::warning title=doctor on {os_name}::"
                + json.dumps(slim, ensure_ascii=False)[:900])
          assert report["ready"]["full_pipeline"] is True, report
          PY

      - name: Extract the demo deck
        run: python scripts/make_course.py extract --deck examples/demo.pptx --work "$RUNNER_TEMP/build" --dpi 100

      - name: Write the narration (the shipped example script)
        run: cp examples/narration.example.json "$RUNNER_TEMP/build/narration.json"

      - name: Build (LibreOffice → PNG → edge-tts → course.mp4)
        run: |
          set -euo pipefail
          python scripts/make_course.py build --work "$RUNNER_TEMP/build" \
            --resolution 1280x720 --motion none | tee build.log

      - name: Assert the demo builds the same shape as on Windows
        run: |
          python - <<'PY'
          import json, pathlib

          text = pathlib.Path("build.log").read_text(encoding="utf-8-sig")
          lines = text.strip().splitlines()
          summary = None
          for i in range(len(lines) - 1, -1, -1):
              if lines[i].lstrip().startswith("{"):
                  try:
                      summary = json.loads("\n".join(lines[i:]))
                  except json.JSONDecodeError:
                      summary = None
                  if summary:
                      break
          assert summary, "no JSON summary"
          print(json.dumps(summary, ensure_ascii=False, indent=1))
          assert summary.get("ok") is True, summary
          assert summary.get("srt_cues", 0) > 0, "no subtitles: word timings were lost"
          print("FULL PIPELINE OK")
          PY
